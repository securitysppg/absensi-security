<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sistem Absensi & Patroli Security</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff;}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Segoe UI,sans-serif;}
</style>
</head>
<body>
<div id="loading">Memuat aplikasi…</div>
<iframe id="app" allow="geolocation *; camera *; microphone *; clipboard-write *" title="Sistem Absensi & Patroli Security"></iframe>

<script>
// ============ KONFIGURASI ============
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyxzP8d5ZYQvX0_765fGY6WNfie6wB0FPoY2fo1-Og3LPQzBhrVZb4XsSHdVBIMn0I5/exec;
// 'iframe'   = alamat tetap github.io (aplikasi tampil di dalam halaman ini)
// 'redirect' = langsung dialihkan ke alamat script.google.com
const MODE = 'iframe';
// =====================================

const q = new URLSearchParams(location.search);
const params = new URLSearchParams();
if (q.get('page'))  params.set('page',  q.get('page'));
if (q.get('token')) params.set('token', q.get('token'));

if (MODE === 'redirect') {
  location.replace(EXEC_URL + (params.toString() ? '?' + params.toString() : ''));
} else {
  params.set('front', location.origin + location.pathname);
  const frame = document.getElementById('app');
  frame.addEventListener('load', () => { document.getElementById('loading').style.display = 'none'; });
  frame.src = EXEC_URL + '?' + params.toString();
}

// Pindah halaman (login → dashboard) tanpa keluar dari domain GitHub
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'security-nav' || typeof d.url !== 'string') return;
  if (!/(^|\.)google(usercontent)?\.com$/.test(new URL(e.origin).hostname)) return;
  if (d.url.indexOf(location.origin + location.pathname) !== 0) return;
  location.href = d.url;
});
</script>
</body>
</html>
